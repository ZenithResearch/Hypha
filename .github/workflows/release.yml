name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    environment: release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Verify release tag and encryption gate
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          gate_sha=$(python3 -c 'import json; print(json.load(open("release/encryption-gate.json"))["commit_sha"])')
          git merge-base --is-ancestor "$gate_sha" "$GITHUB_SHA"
          test "$(python3 -c 'import json; print(json.load(open("release/encryption-gate.json"))["status"])')" = passed
          git diff --quiet "$gate_sha" "$GITHUB_SHA" -- Package.swift Sources Vendor
      - name: Install pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 /tmp/gitleaks.tar.gz | shasum -a 256 -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan release history and candidate tree
        run: |
          /tmp/gitleaks git . --log-opts='--all' --redact --no-banner
          /tmp/gitleaks dir . --max-archive-depth=2 --max-target-megabytes=300 --redact --no-banner
      - name: Verify release policy and tests
        run: |
          python3 scripts/verify_public_release.py
          python3 scripts/test_public_release_verifier.py
          python3 scripts/test_release_metadata.py
          swift test
      - name: Import Developer ID Application certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          : "${MACOS_CERTIFICATE_P12:?Missing MACOS_CERTIFICATE_P12}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD}"
          : "${RELEASE_KEYCHAIN_PASSWORD:?Missing RELEASE_KEYCHAIN_PASSWORD}"
          keychain="$RUNNER_TEMP/hypha-release.keychain-db"
          certificate="$RUNNER_TEMP/hypha-release.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate"
          security create-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RELEASE_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RELEASE_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity_count=$(security find-identity -v -p codesigning "$keychain" | grep -c 'Developer ID Application' || true)
          test "$identity_count" -eq 1
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2}')
          echo "HYPHA_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "HYPHA_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Import App Store Connect notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          : "${APPLE_API_KEY_P8:?Missing APPLE_API_KEY_P8}"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | /usr/bin/base64 -D > "$key"
          chmod 600 "$key"
          echo "HYPHA_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build, notarize, staple, and package release
        env:
          HYPHA_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          HYPHA_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          : "${HYPHA_NOTARY_KEY_ID:?Missing APPLE_API_KEY_ID}"
          : "${HYPHA_NOTARY_ISSUER_ID:?Missing APPLE_API_ISSUER_ID}"
          scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Hypha-${GITHUB_REF_NAME}-macos-arm64.zip" \
            "dist/Hypha-${GITHUB_REF_NAME}-release.json" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --generate-notes \
            --title "Hypha ${GITHUB_REF_NAME#v}"
      - name: Remove release keychain
        if: always()
        run: |
          if [[ -n "${HYPHA_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$HYPHA_RELEASE_KEYCHAIN" || true
          fi
