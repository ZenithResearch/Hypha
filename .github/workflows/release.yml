name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    environment: release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Verify release tag and encryption gate
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          gate_sha=$(python3 -c 'import json; print(json.load(open("release/encryption-gate.json"))["commit_sha"])')
          git merge-base --is-ancestor "$gate_sha" "$GITHUB_SHA"
          test "$(python3 -c 'import json; print(json.load(open("release/encryption-gate.json"))["status"])')" = passed
          git diff --quiet "$gate_sha" "$GITHUB_SHA" -- Package.swift Package.resolved Sources Vendor Resources scripts/update-from-main.sh scripts/launch-update-from-main.command build-app.sh
      - name: Install pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 /tmp/gitleaks.tar.gz | shasum -a 256 -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan release history and candidate tree
        run: |
          /tmp/gitleaks git . --log-opts='--all' --redact --no-banner
          /tmp/gitleaks dir . --max-archive-depth=2 --max-target-megabytes=300 --redact --no-banner
      - name: Verify release policy and tests
        run: |
          python3 scripts/verify_public_release.py
          python3 scripts/test_public_release_verifier.py
          python3 scripts/test_release_metadata.py
          python3 scripts/test_package_release.py
          python3 scripts/test_prepare_release_signing.py
          python3 scripts/test_update_launcher.py
          swift test
      - name: Import Developer ID identity and notarization key
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          RELEASE_KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/prepare-release-signing.sh
      - name: Build, sign, notarize, and package distributable release
        env:
          HYPHA_RELEASE_MODE: distributable
          HYPHA_RELEASE_ALLOW_UNTAGGED: '0'
          HYPHA_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          HYPHA_NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/package-release.sh "$GITHUB_REF_NAME" dist
      - name: Verify distributable release metadata
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path(f"dist/Hypha-{os.environ['GITHUB_REF_NAME']}-release.json").read_text())
          expected = {"mode": "developer-id", "notarized": True, "distributable": True}
          if metadata.get("signing") != expected:
              raise SystemExit("release metadata does not prove Developer ID signing and notarization")
          PY
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Hypha-${GITHUB_REF_NAME}-macos-arm64.zip" \
            "dist/Hypha-${GITHUB_REF_NAME}-release.json" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --notes-file release/RELEASE_NOTES.md \
            --title "Hypha ${GITHUB_REF_NAME#v}"
      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [[ -n "${HYPHA_RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$HYPHA_RELEASE_KEYCHAIN_PATH" || true
          fi
          for path in \
            "${HYPHA_RELEASE_CERTIFICATE_PATH:-}" \
            "${HYPHA_NOTARY_KEY_PATH:-}"; do
            if [[ -n "$path" ]]; then
              rm -f -- "$path"
            fi
          done
          if [[ -n "${HYPHA_RELEASE_CREDENTIAL_DIR:-}" ]]; then
            rmdir "$HYPHA_RELEASE_CREDENTIAL_DIR" || true
          fi
